name: Bug report
description: Something in SeerrCtrl doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Before you post, please remove server addresses, passwords, API keys and other personal info from your text and screenshots. This issue is public.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Tell us what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: input
    id: app-version
    attributes:
      label: SeerrCtrl version
      placeholder: "Profile picture > About, e.g. 1.9.4"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and phone
      placeholder: "Android 15, Pixel 8"
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Seerr / Jellyseerr version
      placeholder: "Settings > About in the web UI"
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - GitHub Releases
        - Obtainium
        - CtrlF-Droid
        - Built it myself
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Drag images here. Remember to hide addresses, passwords and API keys.
