name: Dependency verification metadata

# Started by hand whenever a dependency, Gradle plugin or the Gradle version changes. It resolves
# everything the build uses, from a clean cache, and prints a new gradle/verification-metadata.xml
# (sha256 checksums) to the log, gzipped and base64-encoded. Check the diff and commit the file in
# the same push as the dependency change, or the build fails its dependency verification.
on:
  workflow_dispatch:

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # Fresh downloads only: a cached artifact must never end up trusted.
          cache-disabled: true

      - name: Write verification metadata
        run: |
          chmod +x gradlew
          # Start from the configuration only (trusted sources/javadoc jars), so entries for
          # dependencies that are no longer used don't pile up.
          if [ -f gradle/verification-metadata.xml ]; then
            python3 -I - <<'PY'
          import pathlib, re
          p = pathlib.Path("gradle/verification-metadata.xml")
          p.write_text(re.sub(r"\s*<components>.*?</components>", "", p.read_text(), flags=re.S))
          PY
          fi
          # The same tasks as the build, code scanning and the dependency audit. Without CI set, the release
          # build is signed with the debug key here; it needs no secrets and resolves the same dependencies.
          env -u CI -u GITHUB_ACTIONS ./gradlew --no-daemon --write-verification-metadata sha256 \
            assembleRelease assembleDebug :app:dependencies --configuration releaseRuntimeClasspath > /dev/null

      - name: Print the file
        run: |
          sha256sum gradle/verification-metadata.xml
          grep -c '<component ' gradle/verification-metadata.xml || true
          echo "----- BEGIN verification-metadata.xml.gz.b64 -----"
          gzip -9nc gradle/verification-metadata.xml | base64 -w 76
          echo "----- END verification-metadata.xml.gz.b64 -----"
