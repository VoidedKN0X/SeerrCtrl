name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Read-only by default; only the release job below gets write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sig.outputs.signed }}
      tag: ${{ steps.sig.outputs.tag }}
      version: ${{ steps.sig.outputs.version }}
      apk: ${{ steps.sig.outputs.apk }}
    steps:
      # Actions are pinned to exact commits (the comment shows the version).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Says only *where* each signing value comes from (secret or variable), never the value.
      - name: Check signing value sources
        env:
          S_KS: ${{ secrets.KEYSTORE_BASE64 != '' }}
          V_KS: ${{ vars.KEYSTORE_BASE64 != '' }}
          S_SP: ${{ secrets.KEYSTORE_PASSWORD != '' }}
          V_SP: ${{ vars.KEYSTORE_PASSWORD != '' }}
          S_KP: ${{ secrets.KEY_PASSWORD != '' }}
          V_KP: ${{ vars.KEY_PASSWORD != '' }}
        run: |
          src() { if [ "$1" = true ]; then echo secret; elif [ "$2" = true ]; then echo variable; else echo missing; fi; }
          echo "::notice title=Signing sources::KEYSTORE_BASE64=$(src "$S_KS" "$V_KS") KEYSTORE_PASSWORD=$(src "$S_SP" "$V_SP") KEY_PASSWORD=$(src "$S_KP" "$V_KP")"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::error title=Unsigned build::No signing key set - refusing to build a debug-signed release"
            exit 1
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}
          # The alias isn't secret; it's kept as a repository variable.
          SIGNING_KEY_ALIAS: ${{ vars.KEY_ALIAS || secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || vars.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; then
            # Surface compiler errors as an annotation so they're visible without opening the logs.
            msg=$(grep -E "^e: |What went wrong|error:|FAILED" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$msg"
            exit 1
          fi

      # Remove the key as soon as signing is done, even if the build failed.
      - name: Delete signing key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=" >> "$GITHUB_ENV"

      - name: Name APK and check signature
        id: sig
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}-build.${RUN_NUMBER}"
          APK="SeerrCtrl-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "certificate DN" | sed 's/^[^:]*: //')
          SHA=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "SHA-256" | sed 's/^.*: //')
          echo "Signed by: $CERT"
          if [ "$RELEASE_SIGNED" != "1" ] || echo "$CERT" | grep -q "Android Debug"; then
            echo "::error title=Signing failed::The APK is not release-signed - check the keystore, key alias and passwords"
            exit 1
          fi
          echo "::notice title=Signed APK::$APK signed by $CERT (SHA-256 $SHA)"
          {
            echo "signed=1"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "apk=$APK"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SeerrCtrl-apk
          path: |
            ${{ env.APK }}
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  # Publishes the release in its own job: no signing secrets here, only the finished APK,
  # and only this job can write to the repository. Runs only for a release-signed APK.
  release:
    needs: build
    if: needs.build.outputs.signed == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SeerrCtrl-apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          APK: ${{ needs.build.outputs.apk }}
          RUN_NUMBER: ${{ github.run_number }}
          CHANGES: ${{ github.event.head_commit.message || 'manual build' }}
        run: |
          {
            echo "**SeerrCtrl ${VERSION}**, build ${RUN_NUMBER}"
            echo
            echo "Download **${APK}** below and open it on your phone to install or update."
            echo
            echo "Changes in this build: ${CHANGES}"
          } > notes.md
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "SeerrCtrl ${VERSION} (build ${RUN_NUMBER})" \
            --notes-file notes.md \
            --latest
